[advisories]
# libcrux-ml-dsa =0.0.8 — monitor for 0.1.0 stable release.
# RUSTSEC-2026-0125 / RUSTSEC-2026-0126: AVX2 backend soundness issues in libcrux-ml-dsa 0.0.8.
# See IACR eprint 2026/192. We use the portable backend (no AVX2 code path active).
# These advisories do NOT affect latticeshield. Ignored with rationale; upgrade to 0.0.9+ when stable.
ignore = [
    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained — no safe upgrade available.
    # Used only for TLS cert/key loading at startup; not in the hot crypto path.
    { id = "RUSTSEC-2025-0134" },
    # RUSTSEC-2026-0125: libcrux-ml-dsa 0.0.8 AVX2 signature verification edge case.
    # We use the portable backend only — AVX2 code path is never activated.
    { id = "RUSTSEC-2026-0125" },
    # RUSTSEC-2026-0126: libcrux-ml-dsa 0.0.8 AVX2 intermediate value reduction notice.
    # We use the portable backend only — AVX2 code path is never activated.
    { id = "RUSTSEC-2026-0126" },
    # RUSTSEC-2026-0098: rustls-webpki 0.103.x — name constraints for URI names incorrectly accepted.
    # Only affects certificate validation with URI-typed name constraints, which we do not use.
    # No upgrade path available without a breaking rustls bump; tracked for next dependency update cycle.
    { id = "RUSTSEC-2026-0098" },
    # RUSTSEC-2026-0099: rustls-webpki 0.103.x — wildcard name constraints accepted incorrectly.
    # Same scope as RUSTSEC-2026-0098 — URI/wildcard name constraint path not exercised.
    { id = "RUSTSEC-2026-0099" },
    # RUSTSEC-2026-0104: rustls-webpki 0.103.x — reachable panic in CRL parsing.
    # We do not use certificate revocation lists (CRLs) in our TLS setup. Not reachable.
    { id = "RUSTSEC-2026-0104" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
]
# Nuestras crates internas usan license = "UNLICENSED" (no publicadas en crates.io).
# private.ignore = true suprime el error[unlicensed] para crates no publicadas.
private = { ignore = true }

[bans]
# Prohibir wrappers FFI sobre librerias C en rutas criptograficas
deny = [
    { name = "oqs" },
    { name = "oqs-rs" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
