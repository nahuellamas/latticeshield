[advisories]
ignore = [
    # RUSTSEC-2025-0144: timing side-channel en el crate ml-dsa (RustCrypto).
    # Nosotros usamos libcrux-ml-dsa (Cryspen), que NO esta afectado por este advisory.
    { id = "RUSTSEC-2025-0144" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
]
# Nuestras crates internas usan license = "UNLICENSED" (no publicadas en crates.io).
# private.ignore = true suprime el error[unlicensed] para crates no publicadas.
private = { ignore = true }

[bans]
# Prohibir wrappers FFI sobre librerias C en rutas criptograficas
deny = [
    { name = "oqs" },
    { name = "oqs-rs" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
