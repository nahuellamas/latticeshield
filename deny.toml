[advisories]
ignore = [
    # RUSTSEC-2025-0144: ml-dsa timing side-channel.
    # Usado solo para OTA signing (no implementado aun). Migrar a libcrux-ml-dsa en Mes 3.
    "RUSTSEC-2025-0144",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
]

[bans]
# Prohibir wrappers FFI sobre librerias C en rutas criptograficas
deny = [
    { name = "oqs" },
    { name = "oqs-rs" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
