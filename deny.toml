[advisories]
# libcrux-ml-dsa pinned at =0.0.9 — monitor for 0.1.0 stable release.
# 0.0.9 fixes the AVX2 use_hint edge case (GHSA-fhvh-vw7h-9xf3 / RUSTSEC-2026-0125).
# We use the portable backend, but upgrading reduces risk surface regardless.
ignore = [
    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained — no safe upgrade available.
    # Used only for TLS cert/key loading at startup; not in the hot crypto path.
    { id = "RUSTSEC-2025-0134" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
]
# Nuestras crates internas usan license = "UNLICENSED" (no publicadas en crates.io).
# private.ignore = true suprime el error[unlicensed] para crates no publicadas.
private = { ignore = true }

[bans]
# Prohibir wrappers FFI sobre librerias C en rutas criptograficas
deny = [
    { name = "oqs" },
    { name = "oqs-rs" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
