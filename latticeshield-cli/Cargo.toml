[package]
name        = "latticeshield-cli"
description = "Unified CLI for LatticeShield key management"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
publish.workspace    = true
repository.workspace = true

[[bin]]
name = "latticeshield"
path = "src/main.rs"

[dependencies]
latticeshield-bridge = { path = "../latticeshield-bridge", features = ["tls-keygen"] }
latticeshield-client = { path = "../latticeshield-client" }
anyhow     = { workspace = true }
clap       = { version = "4", features = ["derive", "env"] }
colored    = "2"
reqwest    = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls-native-roots-no-provider"] }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile   = "3"
