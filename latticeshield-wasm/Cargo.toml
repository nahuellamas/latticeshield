[package]
name    = "latticeshield-wasm"
version = "0.2.0"
edition = "2021"
authors = ["LatticeShield"]
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# PQC — portable backend, no-std compatible, no libc
libcrux-ml-dsa = { version = "=0.0.8", default-features = false, features = ["mldsa65"] }
ml-kem         = { version = "0.2", default-features = false }
# X25519 + HKDF for client-side handshake
x25519-dalek   = { version = "2", default-features = false, features = ["static_secrets"] }
hkdf           = { version = "0.12", default-features = false }
sha2           = { version = "0.10", default-features = false }
# hybrid-array needed by ml-kem
hybrid-array   = "0.2"
# RNG: getrandom with js feature routes to crypto.getRandomValues in browser / node:crypto in Node
rand_core      = { version = "0.6", features = ["getrandom"] }
getrandom      = { version = "0.2", features = ["js"] }
# WASM bindgen + zeroize for SigningKey hygiene
wasm-bindgen   = "0.2"
js-sys         = "0.3"
zeroize        = { version = "1", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
