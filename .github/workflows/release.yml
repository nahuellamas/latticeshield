name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
            sha256_cmd: sha256sum
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
            sha256_cmd: sha256sum
          - target: x86_64-apple-darwin
            runner: macos-14
            cross: false
            sha256_cmd: shasum -a 256
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            sha256_cmd: shasum -a 256

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake

      - name: Set cross-compile env
        if: matrix.cross
        run: |
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin latticeshield-bridge \
            --bin latticeshield-client \
            --bin latticeshield

      - name: Rename binaries
        run: |
          for bin in latticeshield-bridge latticeshield-client latticeshield; do
            mv "target/${{ matrix.target }}/release/${bin}" "./${bin}-${{ matrix.target }}"
          done

      - name: Generate per-target checksums
        run: |
          ${{ matrix.sha256_cmd }} \
            "latticeshield-bridge-${{ matrix.target }}" \
            "latticeshield-client-${{ matrix.target }}" \
            "latticeshield-${{ matrix.target }}" \
            > "checksums-${{ matrix.target }}.txt"

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: |
            latticeshield-bridge-${{ matrix.target }}
            latticeshield-client-${{ matrix.target }}
            latticeshield-${{ matrix.target }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.target }}
          path: checksums-${{ matrix.target }}.txt

  merge-checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true

      - name: Merge into single checksums.txt
        run: cat checksums-*.txt | sort > checksums.txt

      - name: Upload merged checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-final
          path: checksums.txt

  upload-release:
    needs: [build, merge-checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true

      - name: Download merged checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-final

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latticeshield-bridge-*
            latticeshield-client-*
            latticeshield-x86_64-*
            latticeshield-aarch64-*
            checksums.txt

  publish-npm:
    # Gate on the binary release succeeding first. If cross-compilation or
    # GitHub-release upload fail, we must NOT publish @latticeshield/js to npm —
    # users would otherwise install a package whose paired bridge binaries do
    # not exist for this tag.
    needs: [build, upload-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write is set so npm-publish CAN exchange the workflow's OIDC
      # token for short-lived publish credentials once a Trusted Publisher is
      # configured for @latticeshield/js on the npm side. Until then, the
      # NODE_AUTH_TOKEN env (below) is used as a transitional bootstrap.
      #
      # MIGRATION PATH (do this post-HN, then delete the classic token):
      #   1. Bootstrap the package by running this workflow once with
      #      NODE_AUTH_TOKEN set to an npm Automation token.
      #   2. Configure a Trusted Publisher on npmjs.com for @latticeshield/js
      #      pointing to nahuellamas/latticeshield + this workflow file.
      #   3. Delete the NODE_AUTH_TOKEN secret from GitHub.
      #   4. Delete the classic Automation token from npm.
      #   5. Subsequent publishes use OIDC trusted publishing automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Build and publish @latticeshield/js
        working-directory: latticeshield-js
        run: |
          npm ci
          npm run build
          # --provenance: emits signed provenance attestation tied to this workflow run.
          # Works with both classic-token auth AND trusted publishing.
          npm publish --provenance --access public
        env:
          # Bootstrap path: classic token from GitHub secrets. After trusted
          # publishing is configured on npm, this env var can be removed (npm
          # will use OIDC automatically and ignore an empty value here).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
