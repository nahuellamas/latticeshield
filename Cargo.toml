[workspace]
members = [
    "latticeshield-crypto",
    "latticeshield-bridge",
    "latticeshield-client",
    "latticeshield-cli",
    "latticeshield-wasm",
]
resolver = "2"

[workspace.package]
version     = "0.2.0"
edition     = "2021"
authors     = ["LatticeShield"]
license     = "UNLICENSED"
publish     = false
repository  = "https://github.com/nahuellamas/latticeshield"

[workspace.dependencies]
# Criptografia PQC — Rust puro, sin FFI
ml-kem       = { version = "0.2", features = ["std"] }
# ml-dsa: pendiente 0.1.0 estable — ver memoria tracking/ml-dsa-stable-release
# (0.0.4 tiene RUSTSEC-2025-0144 + CVE-2026-24850 sin parchear en stable)
# Usando libcrux-ml-dsa como alternativa auditada hasta que RustCrypto publique 0.1.0 stable.
libcrux-ml-dsa = { version = "=0.0.8", default-features = false, features = ["mldsa65"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf         = "0.12"
sha2         = "0.10"
aes-gcm      = "0.10"
rand_core    = { version = "0.6", features = ["getrandom"] }

# Red y transporte
tokio  = { version = "1", features = ["full"] }
quinn  = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23", features = ["prefer-post-quantum"] }

# API Control Plane
axum  = "0.7"
sqlx  = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls"] }

# Observabilidad
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter"] }
metrics                     = "0.22"
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = ["http-listener"] }

# Utilidades
anyhow  = "1"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
serde   = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level       = 3
lto             = true
codegen-units   = 1
strip           = true
